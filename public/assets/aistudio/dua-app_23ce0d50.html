<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>দোয়া সমগ্র — দৈনন্দিন দোয়া</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Amiri:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;600&display=swap');

  :root{
    --ink:#0f2e28;
    --ink-soft:#3c5c54;
    --paper:#f6f1e4;
    --paper-deep:#ede4cd;
    --gold:#b8873b;
    --gold-bright:#d4a24e;
    --emerald:#0f4a3c;
    --emerald-deep:#0a3229;
    --line: rgba(15,46,40,0.14);
    --card: #fffdf7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 8%, rgba(184,135,59,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(15,74,60,0.10), transparent 45%),
      var(--paper);
    font-family:'Noto Sans Bengali','Noto Serif Bengali',serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }

  /* ---------- Header ---------- */
  header{
    position:relative;
    padding:38px 20px 30px;
    text-align:center;
    background:linear-gradient(180deg, var(--emerald-deep), var(--emerald) 70%, transparent);
    color:var(--paper);
    overflow:hidden;
  }
  header::before, header::after{
    content:"";
    position:absolute;
    width:220px; height:220px;
    border:1px solid rgba(212,162,78,0.25);
    border-radius:50%;
    top:-110px;
  }
  header::before{ left:-70px; }
  header::after{ right:-70px; }
  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    text-transform:uppercase;
    color:var(--gold-bright);
    font-family:'Noto Sans Bengali',sans-serif;
    margin-bottom:10px;
  }
  header h1{
    font-family:'Amiri','Noto Serif Bengali',serif;
    font-weight:700;
    font-size:32px;
    margin:0 0 6px;
  }
  header p{
    margin:0;
    font-size:14px;
    color:rgba(246,241,228,0.78);
  }
  .bismillah{
    font-family:'Amiri',serif;
    font-size:22px;
    margin-top:16px;
    color:var(--gold-bright);
    direction:rtl;
  }

  /* ---------- Category rail ---------- */
  .rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:16px 16px 6px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    transition:all .18s ease;
  }
  .chip.active{
    background:var(--emerald);
    color:var(--paper);
    border-color:var(--emerald);
  }

  /* ---------- List ---------- */
  .list{
    padding:10px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:640px;
    margin:0 auto;
  }
  .duacard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .duacard:active{ transform:scale(0.985); }
  .duacard.open{
    border-color:var(--gold);
    box-shadow:0 6px 22px rgba(15,46,40,0.10);
  }
  .row-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .tag{
    font-size:11px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:0.04em;
    margin-bottom:4px;
    display:block;
  }
  .title-bn{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
  }
  .chevron{
    width:22px;height:22px;
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:13px;
    transition:transform .2s ease;
  }
  .duacard.open .chevron{ transform:rotate(180deg); background:var(--emerald); color:var(--paper); border-color:var(--emerald);}

  .detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .duacard.open .detail{ max-height:600px; }
  .detail-inner{
    padding-top:14px;
    margin-top:14px;
    border-top:1px dashed var(--line);
  }
  .arabic{
    direction:rtl;
    font-family:'Amiri',serif;
    font-size:24px;
    line-height:2.1;
    color:var(--emerald-deep);
    text-align:right;
    background:var(--paper-deep);
    padding:14px 16px;
    border-radius:10px;
    border-right:3px solid var(--gold);
  }
  .label{
    font-size:11px;
    font-weight:700;
    color:var(--gold);
    letter-spacing:0.06em;
    margin:14px 0 4px;
  }
  .uccharon{
    font-size:15px;
    color:var(--ink-soft);
    font-style:normal;
    line-height:1.7;
  }
  .ortho{
    font-size:14.5px;
    color:var(--ink);
    line-height:1.75;
  }
  .somoy{
    display:inline-block;
    margin-top:12px;
    font-size:12px;
    background:rgba(15,74,60,0.08);
    color:var(--emerald);
    padding:4px 10px;
    border-radius:20px;
    font-weight:600;
  }

  .listen-btn{
    margin-top:14px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px;
    border:none;
    border-radius:10px;
    background:var(--emerald);
    color:var(--paper);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease;
  }
  .listen-btn:active{ background:var(--emerald-deep); }
  .listen-btn.speaking{ background:var(--gold); color:var(--emerald-deep); }
  .listen-btn svg{ width:16px;height:16px; }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:20px;
  }

  @media (prefers-reduced-motion: reduce){
    .duacard, .chevron, .detail{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">দৈনন্দিন আমল</div>
  <h1>দোয়া সমগ্র</h1>
  <p>ক্লিক করুন — উচ্চারণসহ দোয়া পড়ুন ও শুনুন</p>
  <div class="bismillah">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
</header>

<div class="rail" id="rail"></div>
<div class="list" id="list"></div>

<footer>স্পিকার বাটনে চাপ দিলে ব্রাউজার আরবি উচ্চারণ পড়ে শোনাবে (ডিভাইস সাপোর্ট সাপেক্ষে)।</footer>

    uc:"আল্লাহুম্মা ইন্নি লাকা সুমতু ওয়া বিকা আমানতু ওয়া আলা রিযক্বিকা আফতরতু",
    or:"হে আল্লাহ! আমি তোমারই জন্য রোজা রেখেছি, তোমার প্রতিই ঈমান এনেছি এবং তোমার দেওয়া রিযিক দ্বারা ইফতার করলাম।"},
  {cat:"রোজা-ইবাদত", title:"রোজার নিয়ত", somoy:"সাহরির সময়",
    ar:"وَبِصَوْمِ غَدٍ نَّوَيْتُ مِنْ شَهْرِ رَمَضَانَ",
    uc:"ওয়া বিসাওমি গাদিন নাওয়াইতু মিন শাহরি রামাদান",
    or:"আমি রমজান মাসের আগামীকালের রোজা রাখার নিয়ত করলাম।"},
  {cat:"কবর ও ইন্তেকাল", title:"কবরস্থানে প্রবেশের দোয়া", somoy:"কবরস্থানে গেলে",
    ar:"اَلسَّلَامُ عَلَيْكُمْ اَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِيْنَ وَالْمُسْلِمِيْنَ وَاِنَّآ اِنْ شَآءَ اللّٰهُ بِكُمْ لَاحِقُوْنَ",
    uc:"আসসালামু আলাইকুম আহলাদ দিয়ারি মিনাল মুমিনিনা ওয়াল মুসলিমিন, ওয়া ইন্না ইনশাআল্লাহু বিকুম লাহিকুন",
    or:"হে কবরবাসী মুমিন ও মুসলিমগণ! তোমাদের প্রতি শান্তি বর্ষিত হোক, আমরাও ইনশাআল্লাহ তোমাদের সাথে মিলিত হব।"},
  {cat:"যাতায়াত", title:"নতুন এলাকায় প্রবেশের দোয়া", somoy:"নতুন স্থানে পৌঁছালে",
    ar:"اَعُوْذُ بِكَلِمَاتِ اللّٰهِ التَّآمَّاتِ مِنْ شَرِّ مَا خَلَقَ",
    uc:"আউযু বিকালিমাতিল্লাহিত তাম্মাতি মিন শাররি মা খলাক্ব",
    or:"আল্লাহর পরিপূর্ণ বাণীসমূহের মাধ্যমে আমি তাঁর সৃষ্টির অনিষ্ট থেকে আশ্রয় প্রার্থনা করছি।"},
  {cat:"কুরআন-জিকির", title:"দ্বীনের উপর অবিচল থাকার দোয়া", somoy:"যেকোনো সময়",
    ar:"رَبَّنَا لَا تُزِغْ قُلُوْبَنَا بَعْدَ اِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَّدُنْكَ رَحْمَةً اِنَّكَ اَنْتَ الْوَهَّابُ",
    uc:"রব্বানা লা তুযিগ কুলুবানা বা'দা ইয হাদাইতানা ওয়া হাবলানা মিল্লাদুনকা রহমাহ, ইন্নাকা আনতাল ওয়াহহাব",
    or:"হে আমাদের প্রতিপালক! আমাদের হেদায়েত দেওয়ার পর আমাদের অন্তরকে বাঁকা করে দিও না এবং তোমার নিকট থেকে আমাদের রহমত দান করো, নিশ্চয় তুমিই মহাদাতা।"},
];

const cats = ["সব", ...Array.from(new Set(duas.map(d=>d.cat)))];
let activeCat = "সব";

const rail = document.getElementById('rail');
const list = document.getElementById('list');

function renderRail(){
  rail.innerHTML = "";
  cats.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (c===activeCat ? ' active' : '');
    chip.textContent = c;
    chip.onclick = ()=>{ activeCat = c; renderRail(); renderList(); };
    rail.appendChild(chip);
  });
}

let openIndex = -1;

function speak(text, btn){
  if(!('speechSynthesis' in window)){
    btn.textContent = "এই ব্রাউজারে ভয়েস সাপোর্ট নেই";
    setTimeout(()=>{ setBtnLabel(btn); }, 1800);
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ar-SA';
  utter.rate = 0.8;
  btn.classList.add('speaking');
  setBtnLabel(btn, true);
  utter.onend = ()=>{ btn.classList.remove('speaking'); setBtnLabel(btn,false); };
  utter.onerror = ()=>{ btn.classList.remove('speaking'); setBtnLabel(btn,false); };
  window.speechSynthesis.speak(utter);
}

function setBtnLabel(btn, speaking){
  btn.innerHTML = speaking
    ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg> পড়া হচ্ছে...`
    : `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> উচ্চারণ শুনুন`;
}

function renderList(){
  list.innerHTML = "";
  const filtered = duas.filter(d=> activeCat==="সব" || d.cat===activeCat);
  filtered.forEach((d, idx)=>{
    const globalIdx = duas.indexOf(d);
    const card = document.createElement('div');
    card.className = 'duacard' + (openIndex===globalIdx ? ' open' : '');
    card.innerHTML = `
      <div class="row-top">
        <div>
          <span class="tag">${d.cat}</span>
          <div class="title-bn">${d.title}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="detail">
        <div class="detail-inner">
          <div class="arabic">${d.ar}</div>
          <div class="label">উচ্চারণ</div>
          <div class="uccharon">${d.uc}</div>
          <div class="label">অর্থ</div>
          <div class="ortho">${d.or}</div>
          <span class="somoy">🕓 ${d.somoy}</span>
          <button class="listen-btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> উচ্চারণ শুনুন</button>
        </div>
      </div>
    `;
    card.querySelector('.row-top').onclick = ()=>{
      openIndex = openIndex===globalIdx ? -1 : globalIdx;
      window.speechSynthesis && window.speechSynthesis.cancel();
      renderList();
    };
    const listenBtn = card.querySelector('.listen-btn');
    listenBtn.onclick = (e)=>{
      e.stopPropagation();
      speak(d.ar, listenBtn);
    };
    list.appendChild(card);
  });
}

renderRail();
renderList();
</script>
</body>
</html>
